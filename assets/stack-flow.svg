<svg xmlns="http://www.w3.org/2000/svg" width="900" height="160" viewBox="0 0 900 160" role="img" aria-labelledby="title description">
  <title id="title">Fluxo da stack full stack</title>
  <desc id="description">Uma animação conecta interfaces, APIs, serviços e bancos de dados.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f" />
      <stop offset="1" stop-color="#100b2d" />
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" />
      <stop offset=".5" stop-color="#818cf8" />
      <stop offset="1" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <path id="route" d="M165 70H735" />
  </defs>

  <rect width="900" height="160" rx="20" fill="url(#panel)" />
  <path d="M165 70H735" stroke="#334155" stroke-width="3" />
  <path d="M165 70H735" stroke="url(#flow)" stroke-width="3" stroke-linecap="round" stroke-dasharray="12 18">
    <animate attributeName="stroke-dashoffset" values="0;-60" dur="2s" repeatCount="indefinite" />
  </path>

  <g filter="url(#glow)">
    <circle r="5" fill="#7dd3fc">
      <animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#route" /></animateMotion>
    </circle>
    <circle r="4" fill="#c084fc">
      <animateMotion dur="3.2s" begin="-1.6s" repeatCount="indefinite"><mpath href="#route" /></animateMotion>
    </circle>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(110 70)">
      <circle r="43" fill="#0f2137" stroke="#38bdf8" stroke-width="2">
        <animate attributeName="r" values="41;44;41" dur="3s" repeatCount="indefinite" />
      </circle>
      <text y="-4" fill="#e2e8f0" font-size="16" font-weight="700">INTERFACE</text>
      <text y="18" fill="#7dd3fc" font-size="11">React • Vue</text>
    </g>
    <g transform="translate(335 70)">
      <circle r="43" fill="#121d3b" stroke="#818cf8" stroke-width="2">
        <animate attributeName="r" values="41;44;41" begin="-.75s" dur="3s" repeatCount="indefinite" />
      </circle>
      <text y="-4" fill="#e2e8f0" font-size="16" font-weight="700">API</text>
      <text y="18" fill="#a5b4fc" font-size="11">REST • Auth</text>
    </g>
    <g transform="translate(565 70)">
      <circle r="43" fill="#19163b" stroke="#a78bfa" stroke-width="2">
        <animate attributeName="r" values="41;44;41" begin="-1.5s" dur="3s" repeatCount="indefinite" />
      </circle>
      <text y="-4" fill="#e2e8f0" font-size="16" font-weight="700">SERVIÇOS</text>
      <text y="18" fill="#c4b5fd" font-size="11">Go • Node</text>
    </g>
    <g transform="translate(790 70)">
      <circle r="43" fill="#21133b" stroke="#c084fc" stroke-width="2">
        <animate attributeName="r" values="41;44;41" begin="-2.25s" dur="3s" repeatCount="indefinite" />
      </circle>
      <text y="-4" fill="#e2e8f0" font-size="16" font-weight="700">DADOS</text>
      <text y="18" fill="#d8b4fe" font-size="11">Postgres • MariaDB</text>
    </g>
  </g>

  <text x="450" y="142" fill="#64748b" font-family="Consolas, monospace" font-size="11" text-anchor="middle" letter-spacing="2">DA EXPERIÊNCIA DO USUÁRIO À PERSISTÊNCIA</text>
  <rect x="1" y="1" width="898" height="158" rx="19" fill="none" stroke="url(#flow)" stroke-opacity=".35" />
</svg>
